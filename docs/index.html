<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaimineeya Samavedam</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-maroon: #800000;
            --primary-gold: #C08535;
            --bg-main: #F9F4E8;
            --text-primary: #2C2C2C;
            --font-heading: 'Noto Serif Devanagari', 'Adishila SanVedic', serif;
            --font-body: 'Noto Sans Devanagari', 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 800px;
        }

        h1 {
            font-family: var(--font-heading);
            color: var(--primary-maroon);
            font-size: 3rem;
            margin-bottom: 2rem;
        }

        .card-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            text-decoration: none;
            color: inherit;
            border: 1px solid #E0E0E0;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-gold);
        }

        .card h2 {
            color: var(--primary-maroon);
            font-family: var(--font-heading);
            margin-top: 0;
        }

        .card p {
            color: #666;
            margin-bottom: 0;
            line-height: 1.5;
        }

        .subtext {
            display: block;
            margin-top: 0.5rem;
            font-size: 1rem;
            color: var(--primary-gold);
            font-weight: bold;
            font-family: var(--font-heading);
        }

        footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Jaimineeya Samavedam</h1>

        <div class="card-container">
            <a href="prakruti/index.html" class="card">
                <h2>Prakruti Ganam</h2>
                <span class="subtext">प्रकृति गानम्</span>
                <p>Browse the Samhita text and chants for the Prakruti Ganam section.</p>
            </a>

            <a href="aranam/index.html" class="card">
                <h2>Aranyam</h2>
                <span class="subtext">अरण्य गानम्</span>
                <p>Access the specialized Aranyam Ganam texts and chants.</p>
            </a>
        </div>

        <footer>
            <p>&copy; 2026 Jaimineeya Samavedam Project</p>
        </footer>
    </div>
</body>

</html>
