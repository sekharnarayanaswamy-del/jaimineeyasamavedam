# Deployment Workflow for Jaimineeya Samavedam
name: Deploy Static Texts to Hostinger

on:
  push:
    branches:
      - main
      - format-mantras

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
    
    - name: 📂 Sync files
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server: ${{ secrets.FTP_SERVER }}
        local_path: './docs/*'
        remote_path: './library'
        sftpOnly: false
